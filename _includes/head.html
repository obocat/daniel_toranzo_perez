<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="HandheldFriendly" content="true"/>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="google-site-verification" content="{{ site.google-verification }}"/>
  <meta name="author" content="{{ site.author }}">
  <meta name="robots" content="all">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var stored = window.localStorage.getItem('cv-lang');
        var browser = (navigator.language || 'es').toLowerCase();
        var lang = stored || (browser.indexOf('es') === 0 ? 'es' : 'en');
        document.documentElement.lang = lang;
        document.documentElement.setAttribute('data-lang', lang);
      } catch (e) {}
    })();
  </script>
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://www.obocat.com{{ page.url | replace:'index.html','' }}">
  <meta property="og:image" content="https://www.obocat.com/images/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Daniel Toranzo Pérez — iOS Engineer. Swift, SwiftUI, UIKit, Objective-C.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ site.description }}">
  <meta name="twitter:image" content="https://www.obocat.com/images/og-card.png">
  <meta name="twitter:image:alt" content="Daniel Toranzo Pérez — iOS Engineer. Swift, SwiftUI, UIKit, Objective-C.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Daniel Toranzo Pérez",
    "jobTitle": "iOS Engineer",
    "url": "https://www.obocat.com/",
    "image": "https://www.obocat.com/images/avatar.jpg",
    "worksFor": { "@type": "Organization", "name": "Nomasystems S.L." },
    "alumniOf": [
      { "@type": "CollegeOrUniversity", "name": "Universidade da Coruña" },
      { "@type": "CollegeOrUniversity", "name": "Universidade de Santiago de Compostela" },
      { "@type": "CollegeOrUniversity", "name": "Universidad Nacional de Educación a Distancia (UNED)" },
      { "@type": "CollegeOrUniversity", "name": "University of Vigo" }
    ],
    "award": "Premio Extraordinario do Máster Universitario en Computación de Altas Prestacións (USC, 2022)",
    "knowsAbout": ["Swift", "SwiftUI", "Objective-C", "UIKit", "Swift Concurrency", "watchOS", "Compositional Layout", "Clean Architecture", "XCTest", "CI/CD", "Clean Code", "Agile"],
    "knowsLanguage": [
      { "@type": "Language", "name": "Spanish" },
      { "@type": "Language", "name": "English", "description": "B1 (CEFR)" }
    ],
    "sameAs": [
      "https://github.com/obocat",
      "https://www.linkedin.com/in/daniel-toranzo-pérez/",
      "https://danieltoranzo.com"
    ]
  }
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N1RRT5HSH8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N1RRT5HSH8');
  </script>
  <!-- AppStore marketing banner -->
  {% if site.show_appstore_banner %}
  <meta name="apple-itunes-app" content="app-id=474175190">
  {% endif %}
  <link rel="stylesheet" href="css/main.css?v={{ site.time | date: '%s' }}">
  <link rel="canonical" href="https://www.obocat.com{{ page.url | replace:'index.html','' }}">
  <link rel="icon" type="image/x-icon" href="favicon.png" />
</head>
