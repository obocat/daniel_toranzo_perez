# Professional profile (ES / EN)
summary: 'iOS Engineer con más de 5 años de experiencia en el Grupo Inditex, desarrollando aplicaciones para <strong>Zara</strong>, <strong>Zara Home</strong> y el entorno de tienda (<strong>Stock/Shopper</strong>, <strong>Compo/Tryon</strong>). Especializado en arquitecturas de interfaz escalables con <strong>Compositional Layout</strong>, <strong>DSLs dinámicos</strong> y <strong>SwiftUI</strong>, y en llevar productos de cero a producción, como la aplicación de distribución con widgets para Apple Watch. Acostumbrado a equipos ágiles distribuidos, con foco en calidad de código, mantenibilidad y experiencia de usuario.'
summary_en: 'iOS Engineer with 5+ years of experience at the Inditex Group, building apps for <strong>Zara</strong>, <strong>Zara Home</strong> and in-store solutions (<strong>Stock/Shopper</strong>, <strong>Compo/Tryon</strong>). Specialised in scalable UI architectures with <strong>Compositional Layout</strong>, <strong>dynamic DSLs</strong> and <strong>SwiftUI</strong>, and in taking products from zero to production &mdash; such as the distribution app with Apple Watch widgets. Used to distributed agile teams, with a focus on code quality, maintainability and user experience.'
location: A Coruña, España · Remoto
